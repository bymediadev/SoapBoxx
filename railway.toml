# Railway service config — SoapBoxx V1 API
# https://docs.railway.com/reference/config-as-code
#
# Dashboard: leave Build Command EMPTY.
# Do NOT use scripts named railway_start.sh — Railpack may run them during build
# (private network unavailable; alembic fails on postgres.railway.internal).

[build]
builder = "RAILPACK"

[deploy]
preDeployCommand = "sh scripts/migrate_db.sh"
startCommand = "sh scripts/start_api.sh"
healthcheckPath = "/health/live"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
