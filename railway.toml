# Railway config — soapboxx-production (API) ONLY
# https://docs.railway.com/reference/config-as-code
#
# Cron/sync uses railway.cron.toml on the soapboxx-sync service (separate config file).
# Do not paste this file into the dashboard Start command field.
#
# Dashboard (API): leave Build / Start / Pre-deploy EMPTY — this file controls deploy.
# Do NOT use scripts named railway_start.sh — Railpack may run them during build.

[build]
builder = "RAILPACK"

[deploy]
preDeployCommand = "sh scripts/migrate_db.sh"
# Inline uvicorn — avoids sh script / CRLF issues; must bind Railway $PORT
startCommand = "python -m uvicorn main:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/health/live"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
