# SoapBoxx V1 — Postgres + Redis (Day 1)
# Usage: docker compose -f docker-compose.v1.yml up -d

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: soapboxx
      POSTGRES_PASSWORD: soapboxx
      POSTGRES_DB: soapboxx_v1
    ports:
      - "5432:5432"
    volumes:
      - soapboxx_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soapboxx -d soapboxx_v1"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  soapboxx_pg_data:
