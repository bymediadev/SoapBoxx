[pytest]
# Third-party snscrape still uses importlib find_module/load_module (deprecated in 3.12).
# Filter until upstream moves to find_spec; SoapBoxx code does not use those APIs.
filterwarnings =
    ignore:find_module\(\) is deprecated:DeprecationWarning
    ignore:FileFinder.find_loader\(\) is deprecated:DeprecationWarning
    ignore:the load_module\(\) method is deprecated:DeprecationWarning
