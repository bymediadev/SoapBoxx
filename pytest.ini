[pytest]
# Default collection: canonical suite under tests/ (avoids picking up ad-hoc test_*.py at repo root).
testpaths = tests

markers =
    integration: third-party HTTP APIs or environment-specific network (use -m "not integration" to skip).
    v1_day1: V1 Day 1 foundation (API, DB, schema)
    v1_day2: V1 Day 2 podcast + episode CRUD
    v1_day3: V1 Day 3 RSS ingestion
    v1_day4: V1 Day 4 transcription + segments
    v1_day5: V1 Day 5 feature extraction (7 metrics)
    v1_day6: V1 Day 6 taxonomy
    v1_day7: V1 Day 7 translation layer
    v1_e2e: V1 full pipeline health check

# Third-party snscrape still uses importlib find_module/load_module (deprecated in 3.12).
# Filter until upstream moves to find_spec; SoapBoxx code does not use those APIs.
filterwarnings =
    ignore:find_module\(\) is deprecated:DeprecationWarning
    ignore:FileFinder.find_loader\(\) is deprecated:DeprecationWarning
    ignore:the load_module\(\) method is deprecated:DeprecationWarning
