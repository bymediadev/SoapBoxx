name: Build Demo Release

on:
  push:
    tags:
      - 'demo-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Demo version (e.g. 1.2.4)'
        required: true
        default: '1.2.4'

permissions:
  contents: write

jobs:
  build-demo-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Package Windows demo
        shell: pwsh
        run: |
          $v = "${{ github.event.inputs.version }}"
          if (-not $v) { $v = "${{ github.ref_name }}" -replace '^demo-v','' }
          ./package_demo_release.ps1 -Version $v

      - uses: actions/upload-artifact@v4
        with:
          name: demo-windows
          path: releases/SoapBoxx-Production-Studio-Demo-v*.zip

  build-demo-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Package macOS demo
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION="${GITHUB_REF_NAME#demo-v}"
          fi
          chmod +x ./package_demo_release_mac.sh
          ./package_demo_release_mac.sh "$VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: demo-macos
          path: releases/SoapBoxx-Production-Studio-Demo-v*-mac.zip

  publish-release:
    needs: [build-demo-windows, build-demo-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect release files
        run: |
          mkdir -p release-assets
          find artifacts -name '*.zip' -exec cp {} release-assets/ \;
          ls -la release-assets/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: SoapBoxx Demo ${{ github.ref_name }}
          body: |
            ## SoapBoxx Production Studio Demo

            | Platform | Download |
            |----------|----------|
            | **Windows** | `SoapBoxx-Production-Studio-Demo-v*-win.zip` (no `-mac` suffix) |
            | **macOS** | `SoapBoxx-Production-Studio-Demo-v*-mac.zip` |

            1. Unzip the file for your platform.
            2. Open **TESTER_QUICKSTART.html** (step-by-step with pictures).
            3. **Windows:** run `Launch SoapBoxx Production Studio Demo.bat`
            4. **macOS:** run `Launch SoapBoxx Production Studio Demo.command` (right-click → Open the first time).

            API keys are not included — paste in Settings or use a `.env` file your host provides.
          files: release-assets/*
          fail_on_unmatch: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
